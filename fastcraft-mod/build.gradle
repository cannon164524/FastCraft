plugins {
    // Minecraft 26.1 and newer are unobfuscated, which Loom serves through its own plugin id
    // ("net.fabricmc.fabric-loom", not the backwards-compatible "fabric-loom" that expects an
    // obfuscated game and a mappings artifact).
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'java'
}

version = "${mod_version}"
group = "${maven_group}"

base {
    archivesName = "${archives_base_name}"
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    // No "mappings" line: 26.3 ships its real class names and parameter names, and Mojang
    // publishes no client_mappings for it, so there is nothing to remap.
    // The unobfuscated Loom does not create modImplementation/modCompileOnly, because mod
    // jars need no remapping here; plain implementation is what a mod depends on.
    implementation "net.fabricmc:fabric-loader:${loader_version}"
    // Only for the biome modification API, which the launcher installs anyway.
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
}

java {
    withSourcesJar()
    // Loom for 26.3 needs a Java 25 runtime, and 26.3 itself requires Java SE 25.
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}
