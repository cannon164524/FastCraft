name: Build Windows exe

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # Loom needs Java 25 for 26.3 (the game itself needs Java SE 25 as well), and the
      # runner's default JVM is 17, which Loom refuses. This one also becomes JAVA_HOME.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      # The amber mod is built here and embedded into FastCraft.exe, so the launcher can
      # install it with the other mods without downloading anything of its own. A Gradle
      # failure is not allowed to stop the launcher build: the edition still works without
      # it, and the step's log is where the API mismatch is read.
      - name: Build the amber mod
        continue-on-error: true
        shell: pwsh
        run: |
          $api = (Invoke-RestMethod 'https://api.modrinth.com/v2/project/fabric-api/version?loaders=%5B%22fabric%22%5D&game_versions=%5B%2226.3%22%5D')[0].version_number
          [xml]$metadata = (Invoke-WebRequest 'https://maven.fabricmc.net/net/fabricmc/fabric-loom/maven-metadata.xml').Content
          $loom = $metadata.metadata.versioning.release
          Write-Host "Fabric API $api, Loom $loom, Java $($env:JAVA_HOME)"
          Push-Location fastcraft-mod
          (Get-Content gradle.properties) `
            -replace '^fabric_api_version=.*', "fabric_api_version=$api" `
            -replace '^loom_version=.*', "loom_version=$loom" | Set-Content gradle.properties
          gradle build --no-daemon -Pmod_version=1.0.${{ github.run_number }}
          Pop-Location
          New-Item -ItemType Directory -Force Assets | Out-Null
          $jar = Get-ChildItem fastcraft-mod/build/libs/*.jar -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -notmatch 'sources' } | Select-Object -First 1
          if ($jar) { Copy-Item $jar.FullName Assets/fastcraft-amber.jar; Write-Host "Embedding $($jar.Name)" }
          else { Write-Host "::warning::No amber mod jar was produced." }

      - name: Draw the app icon
        shell: pwsh
        continue-on-error: true
        run: pwsh -NoProfile -File tools/make-icon.ps1 -Out Assets/FastCraft.ico

      - name: Publish FastCraft.exe
        run: dotnet publish -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:ReadyToRun=true -p:Version=1.0.${{ github.run_number }} -o dist

      - uses: actions/upload-artifact@v4
        with:
          name: FastCraft-windows-x64
          path: dist/

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v1.0.${{ github.run_number }}"
          # What's new is the commits since the previous release, so the update window can
          # show the changes instead of a build stamp. The comparison comes from GitHub's
          # own API: a shallow checkout has no tag to run git log against.
          $previous = gh release view --json tagName -q .tagName 2>$null
          if ($previous) {
              $commits = @(gh api "repos/${{ github.repository }}/compare/$previous...${{ github.sha }}" `
                  --jq '.commits[] | "- " + (.commit.message | split("\n")[0])')
          } else {
              $commits = @("- First FastCraft build.")
          }
          if ($commits.Count -eq 0) { $commits = @("- No changes were recorded for this build.") }
          $notes = $commits -join "`n"
          gh release create $tag "dist/FastCraft.exe" --title "FastCraft 1.0.${{ github.run_number }}" --notes $notes --latest
