name: Build Windows exe

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Draw the app icon
        shell: pwsh
        continue-on-error: true
        run: pwsh -NoProfile -File tools/make-icon.ps1 -Out Assets/FastCraft.ico

      - name: Publish FastCraft.exe
        run: dotnet publish -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:ReadyToRun=true -p:Version=1.0.${{ github.run_number }} -o dist

      - uses: actions/upload-artifact@v4
        with:
          name: FastCraft-windows-x64
          path: dist/

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v1.0.${{ github.run_number }}"
          # What's new is the commits since the previous release, so the update window
          # can show the changes instead of a build stamp.
          $previous = gh release view --json tagName -q .tagName 2>$null
          if ($previous) {
              $commits = @(git log "$previous..HEAD" --no-merges --pretty=format:"- %s")
          } else {
              $commits = @(git log -5 --no-merges --pretty=format:"- %s")
          }
          if ($commits.Count -eq 0) { $commits = @("- No changes were recorded for this build.") }
          $notes = $commits -join "`n"
          gh release create $tag "dist/FastCraft.exe" --title "FastCraft 1.0.${{ github.run_number }}" --notes $notes --latest
